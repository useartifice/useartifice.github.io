      <em>Artifice</em> explores a different way of interacting with software. Instead of
      fixed interfaces, it generates the right one for whatever you're trying to do, runs
      entirely on your machine, and disappears when the task is complete.
      <a href="research.html">We document what we learn as we build.</a>
